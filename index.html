<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Warungin — Warung dekat rumah, sekarang online</title>
<meta name="description" content="Warungin menghubungkan pembeli dengan toko dan warung di sekitar mereka." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2314232B'/%3E%3Cpath d='M14 26h36l-3 24H17z' fill='%23F3ECDD'/%3E%3Cpath d='M12 26l4-12h32l4 12z' fill='%23E3A73F'/%3E%3Crect x='27' y='38' width='10' height='12' fill='%23C1432A'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14232B; --ink-soft:#243944; --paper:#F3ECDD; --paper-dim:#E9E0CC;
    --marigold:#E3A73F; --chili:#C1432A; --sage:#6B7A4F; --line:rgba(20,35,43,0.18);
    --font-display:'Fraunces', serif; --font-body:'Plus Jakarta Sans', sans-serif; --font-mono:'IBM Plex Mono', monospace;
    --max:1180px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; font-family:var(--font-body); color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased;}
  img,svg{max-width:100%; display:block;}
  a{color:inherit;}
  button,input,select,textarea{font-family:inherit;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 28px;}
  h1,h2,h3{font-family:var(--font-display); margin:0; line-height:1.1; font-weight:600;}
  .eyebrow-label{font-family:var(--font-mono); font-size:13px; color:var(--chili); letter-spacing:.01em;}
  .btn{display:inline-flex; align-items:center; gap:8px; font-family:var(--font-body); font-weight:700; font-size:15px;
    padding:12px 22px; border-radius:999px; border:1.5px solid transparent; cursor:pointer; text-decoration:none;
    transition:transform .15s ease, background .2s ease, color .2s ease; background:none;}
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--chili); color:var(--paper);}
  .btn-primary:hover{background:#a83a24;}
  .btn-ghost{border-color:var(--ink); color:var(--ink);}
  .btn-ghost:hover{background:var(--ink); color:var(--paper);}
  .btn-sm{padding:7px 14px; font-size:13px;}
  .btn-danger{background:transparent; border-color:var(--chili); color:var(--chili);}
  .btn-danger:hover{background:var(--chili); color:var(--paper);}
  .btn-block{width:100%; justify-content:center;}
  .btn[disabled]{opacity:.55; cursor:not-allowed; transform:none;}

  header{position:sticky; top:0; z-index:50; background:rgba(243,236,221,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  .nav{display:flex; align-items:center; justify-content:space-between; padding:14px 0; gap:16px;}
  .logo{font-family:var(--font-display); font-weight:700; font-size:21px; letter-spacing:-.01em; text-decoration:none; flex:none;}
  .logo span{color:var(--chili);}
  .nav-links{display:flex; gap:26px; font-size:14.5px; font-weight:600; flex:1;}
  .nav-links a{text-decoration:none; opacity:.8; transition:opacity .15s; white-space:nowrap;}
  .nav-links a.active,.nav-links a:hover{opacity:1;}
  .nav-right{display:flex; align-items:center; gap:10px; flex:none;}
  .cart-btn{position:relative; display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px;
    border-radius:50%; border:1.5px solid var(--ink); text-decoration:none;}
  .cart-count{position:absolute; top:-6px; right:-6px; background:var(--chili); color:var(--paper); font-size:10.5px;
    font-weight:800; border-radius:999px; min-width:18px; height:18px; display:flex; align-items:center; justify-content:center; padding:0 4px;}
  .nav-toggle{display:none; background:none; border:none; cursor:pointer; font-size:22px;}
  .user-chip{display:flex; align-items:center; gap:8px; cursor:pointer; padding:6px 12px 6px 6px; border-radius:999px; border:1.5px solid var(--line); position:relative;}
  .user-chip .avatar{width:28px; height:28px; border-radius:50%; background:var(--ink); color:var(--paper); display:flex;
    align-items:center; justify-content:center; font-weight:800; font-size:12.5px; flex:none;}
  .user-menu{position:absolute; top:calc(100% + 8px); right:0; background:var(--paper); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 18px 40px rgba(0,0,0,.15); min-width:200px; padding:8px; display:none; z-index:60;}
  .user-menu.open{display:block;}
  .user-menu a,.user-menu button{display:block; width:100%; text-align:left; padding:10px 12px; border-radius:8px; border:none;
    background:none; font-size:14px; font-weight:600; text-decoration:none; color:var(--ink); cursor:pointer;}
  .user-menu a:hover,.user-menu button:hover{background:var(--paper-dim);}
  @media (max-width:900px){
    .nav-links{display:none; position:absolute; top:100%; left:0; right:0; background:var(--paper); flex-direction:column;
      gap:0; padding:8px 28px 16px; border-bottom:1px solid var(--line);}
    .nav-links.open{display:flex;}
    .nav-links a{padding:10px 0; border-bottom:1px dashed var(--line);}
    .nav-toggle{display:block;}
  }

  .page-banner{background:var(--ink); color:var(--paper); padding:44px 0;}
  .page-banner h1{font-size:clamp(28px,4vw,40px); color:var(--paper);}
  .page-banner p{color:rgba(243,236,221,.75); margin-top:8px; font-size:15px;}
  .breadcrumb{font-family:var(--font-mono); font-size:12.5px; color:rgba(243,236,221,.6); margin-bottom:10px;}
  .breadcrumb a{text-decoration:none;}
  .breadcrumb a:hover{color:var(--marigold);}

  section,.section-pad{padding:56px 0;}
  .section-head{max-width:640px; margin-bottom:36px;}
  .section-head h2{font-size:clamp(26px,3.2vw,36px);}
  .section-head p{font-size:15.5px; line-height:1.6; color:var(--ink-soft); margin-top:10px;}

  .hero{background:var(--ink); color:var(--paper); padding:64px 0;}
  .hero-inner{display:grid; grid-template-columns:1.1fr .9fr; gap:48px; align-items:center;}
  .hero h1{font-size:clamp(36px,5vw,60px); color:var(--paper);}
  .hero h1 em{font-style:normal; color:var(--marigold);}
  .hero p.lede{font-size:17px; line-height:1.6; max-width:46ch; color:rgba(243,236,221,.82); margin:18px 0 28px;}
  .hero-ctas{display:flex; gap:12px; flex-wrap:wrap;}
  .hero-stats{display:flex; gap:26px; margin-top:36px; padding-top:20px; border-top:1px solid rgba(243,236,221,.18); flex-wrap:wrap;}
  .stat b{display:block; font-family:var(--font-mono); font-size:24px; color:var(--marigold);}
  .stat span{font-size:12.5px; color:rgba(243,236,221,.65);}
  .hero-card{background:var(--paper); color:var(--ink); border-radius:14px; padding:26px; box-shadow:0 30px 70px rgba(0,0,0,.35);}
  .hero-card h3{font-size:18px; margin-bottom:14px;}
  @media (max-width:900px){.hero-inner{grid-template-columns:1fr;}}

  .search-bar{display:flex; gap:10px; background:#fff; border:1.5px solid var(--line); border-radius:999px; padding:6px 6px 6px 18px; align-items:center; max-width:640px;}
  .search-bar input{flex:1; border:none; outline:none; background:none; font-size:15px; padding:8px 0;}
  .chip-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}
  .chip{border:1.5px solid var(--line); border-radius:999px; padding:8px 16px; font-size:13.5px; font-weight:700; cursor:pointer; background:#fff; text-decoration:none;}
  .chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:20px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; text-decoration:none; color:var(--ink); display:flex; flex-direction:column; transition:transform .15s ease, box-shadow .15s ease;}
  .card:hover{transform:translateY(-3px); box-shadow:0 16px 30px rgba(20,35,43,.1);}
  .card-media{aspect-ratio:4/3; background:linear-gradient(135deg,var(--marigold),var(--chili)); display:flex; align-items:center; justify-content:center; color:var(--paper); font-family:var(--font-display); font-size:32px; font-weight:700;}
  .card-body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card-body h4{font-family:var(--font-body); font-weight:700; font-size:15px;}
  .card-price{font-family:var(--font-mono); font-weight:700; color:var(--chili); font-size:15px;}
  .card-meta{font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
  .badge{display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:11px; font-weight:600; padding:4px 10px; border-radius:999px;}
  .badge-active{background:rgba(107,122,79,.15); color:var(--sage);}
  .badge-pending{background:rgba(227,167,63,.2); color:#8a6415;}
  .badge-rejected,.badge-danger{background:rgba(193,67,42,.14); color:var(--chili);}
  .badge-info{background:rgba(20,35,43,.08); color:var(--ink-soft);}

  .empty-state{text-align:center; padding:60px 24px; border:1.5px dashed var(--line); border-radius:16px; background:rgba(255,255,255,.4);}
  .empty-state h3{margin-bottom:8px; font-size:20px;}
  .empty-state p{color:var(--ink-soft); margin-bottom:18px; font-size:14.5px;}

  .split{display:grid; grid-template-columns:.9fr 1.4fr; gap:40px; align-items:start;}
  @media (max-width:960px){.split{grid-template-columns:1fr;}}

  .panel{background:#fff; border:1px solid var(--line); border-radius:16px; padding:26px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:14px;}
  @media (max-width:600px){.field-row{grid-template-columns:1fr;}}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:13px; font-weight:700;}
  .field input,.field select,.field textarea{border:1.5px solid var(--line); border-radius:10px; padding:11px 13px; font-size:14.5px; background:#fff; outline:none;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--chili);}
  .field textarea{resize:vertical; min-height:80px;}
  .form-note{font-size:12px; color:var(--ink-soft); margin-top:10px;}
  .form-msg{display:none; padding:12px 14px; border-radius:10px; font-size:13.5px; font-weight:600; margin-bottom:14px;}
  .form-msg.show{display:block;}
  .form-msg.error{background:rgba(193,67,42,.12); color:var(--chili);}
  .form-msg.success{background:rgba(107,122,79,.14); color:var(--sage);}

  .tabs{display:flex; gap:6px; background:var(--paper-dim); border-radius:999px; padding:5px; width:fit-content; margin-bottom:22px; flex-wrap:wrap;}
  .tab-btn{border:none; background:none; padding:9px 18px; border-radius:999px; font-weight:700; font-size:13.5px; cursor:pointer; color:var(--ink-soft);}
  .tab-btn.active{background:var(--ink); color:var(--paper);}

  .dash{display:grid; grid-template-columns:230px 1fr; gap:0; min-height:60vh;}
  @media (max-width:840px){.dash{grid-template-columns:1fr;}}
  .dash-side{background:var(--ink); color:var(--paper); padding:28px 18px;}
  .dash-side h3{color:var(--paper); font-size:15px; margin-bottom:16px; opacity:.7; font-family:var(--font-mono); font-weight:600; text-transform:uppercase; letter-spacing:.05em;}
  .dash-side a{display:block; padding:10px 12px; border-radius:8px; text-decoration:none; font-weight:600; font-size:14px; color:rgba(243,236,221,.75); margin-bottom:2px;}
  .dash-side a.active,.dash-side a:hover{background:rgba(243,236,221,.12); color:var(--paper);}
  .dash-main{padding:32px 28px; background:var(--paper);}
  .dash-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:22px;}
  .dash-head h2{font-size:24px;}

  table.tbl{width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; font-size:14px;}
  table.tbl th{text-align:left; background:var(--paper-dim); padding:12px 14px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; font-family:var(--font-mono); font-weight:600;}
  table.tbl td{padding:12px 14px; border-top:1px solid var(--line); vertical-align:middle;}
  table.tbl tr:hover td{background:rgba(255,255,255,.5);}
  .tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}
  .tbl-wrap table{border-radius:0;}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:28px;}
  .stat-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px;}
  .stat-card b{display:block; font-family:var(--font-mono); font-size:26px; color:var(--chili);}
  .stat-card span{font-size:12.5px; color:var(--ink-soft); font-weight:600;}

  .cart-row{display:flex; gap:14px; align-items:center; padding:16px 0; border-bottom:1px solid var(--line);}
  .cart-row .thumb{width:60px; height:60px; border-radius:10px; background:linear-gradient(135deg,var(--marigold),var(--chili)); flex:none; display:flex; align-items:center; justify-content:center; color:var(--paper); font-weight:700; font-family:var(--font-display);}
  .qty-ctrl{display:flex; align-items:center; gap:8px; border:1.5px solid var(--line); border-radius:999px; padding:4px;}
  .qty-ctrl button{width:26px; height:26px; border-radius:50%; border:none; background:var(--paper-dim); cursor:pointer; font-weight:700;}
  .summary-row{display:flex; justify-content:space-between; padding:8px 0; font-size:14.5px;}
  .summary-row.total{font-weight:800; font-size:18px; border-top:1px solid var(--line); margin-top:8px; padding-top:14px;}

  .toast-wrap{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
  .toast{background:var(--ink); color:var(--paper); padding:13px 20px; border-radius:10px; font-size:14px; font-weight:600; box-shadow:0 12px 30px rgba(0,0,0,.25); animation:toastIn .25s ease;}
  .toast.error{background:var(--chili);}
  @keyframes toastIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

  .qty-select{display:flex; align-items:center; gap:12px; margin:18px 0;}
  .stepper{display:flex; align-items:center; border:1.5px solid var(--line); border-radius:999px;}
  .stepper button{width:36px; height:36px; border:none; background:none; font-size:18px; cursor:pointer; font-weight:700;}
  .stepper span{min-width:34px; text-align:center; font-weight:700;}

  footer{background:var(--ink); color:rgba(243,236,221,.7); padding:40px 0; margin-top:40px;}
  .foot-bottom{display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; font-size:12.5px; padding-top:20px; border-top:1px solid rgba(243,236,221,.12); margin-top:20px;}
  .foot-brand .logo{color:var(--paper);}
  .foot-brand p{max-width:34ch; font-size:13.5px; margin-top:10px; line-height:1.6;}
  .page-loading{text-align:center; padding:100px 0; color:var(--ink-soft);}
  .muted{color:var(--ink-soft);}
  .mb-0{margin-bottom:0;}
  .inline-form{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="#/" class="logo">warung<span>in</span></a>
    <nav class="nav-links" id="navLinks">
      <a href="#/" data-route="/">Beranda</a>
      <a href="#/cari" data-route="/cari">Cari Produk</a>
      <a href="#/kategori" data-route="/kategori">Kategori</a>
      <a href="#/toko" data-route="/toko">Daftar Toko</a>
    </nav>
    <div class="nav-right" id="navRight"></div>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
  </div>
</header>

<main id="app"><div class="page-loading">Memuat Warungin…</div></main>

<footer>
  <div class="wrap">
    <div class="foot-brand">
      <div class="logo">warung<span>in</span></div>
      <p>Menghubungkan toko dan warung lokal dengan pembeli di sekitarnya, satu transaksi pada satu waktu.</p>
    </div>
    <div class="foot-bottom">
      <span>&copy; 2026 Warungin.</span>
      <span>Dibuat untuk toko dan warung di seluruh Indonesia.</span>
    </div>
  </div>
</footer>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================= DATA LAYER ============================= */
const CATEGORIES = ['Sembako & Kebutuhan Harian','Makanan & Minuman Siap Saji','Sayur & Buah','Jajanan & Kue','Lainnya'];
const ORDER_STATUSES = ['baru','diproses','dikirim','selesai','dibatalkan'];
const STATUS_LABEL = {baru:'Pesanan baru',diproses:'Diproses',dikirim:'Dikirim',selesai:'Selesai',dibatalkan:'Dibatalkan'};
const STORE_STATUS_LABEL = {pending:'Menunggu persetujuan',active:'Aktif',ditolak:'Ditolak'};

function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function rupiah(n){ return 'Rp' + Math.round(n||0).toLocaleString('id-ID'); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||'?').trim().slice(0,1).toUpperCase(); }

async function sGet(key, shared){
  try{ const r = await window.storage.get(key, shared); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function sSet(key, value, shared){
  try{ const r = await window.storage.set(key, JSON.stringify(value), shared); return !!r; }
  catch(e){ console.error('storage error', key, e); return false; }
}
async function sDel(key, shared){ try{ await window.storage.delete(key, shared); }catch(e){} }

const getUsers = async () => (await sGet('users', true)) || [];
const saveUsers = (v) => sSet('users', v, true);
const getStores = async () => (await sGet('stores', true)) || [];
const saveStores = (v) => sSet('stores', v, true);
const getProducts = async () => (await sGet('products', true)) || [];
const saveProducts = (v) => sSet('products', v, true);
const getOrders = async () => (await sGet('orders', true)) || [];
const saveOrders = (v) => sSet('orders', v, true);
const getSettings = async () => (await sGet('settings', true)) || {commissionRate:5};
const saveSettings = (v) => sSet('settings', v, true);
const getSession = async () => await sGet('session', false);
const setSession = (userId) => sSet('session', {userId}, false);
const clearSession = () => sDel('session', false);
const getCart = async () => (await sGet('cart', false)) || [];
const saveCart = (v) => sSet('cart', v, false);

async function currentUser(){
  const s = await getSession();
  if(!s) return null;
  const users = await getUsers();
  return users.find(u=>u.id===s.userId) || null;
}

async function ensureSeed(){
  let users = await getUsers();
  if(!users.some(u=>u.role==='admin')){
    users.push({id:uid('usr'), name:'Admin Warungin', contact:'admin@warungin.id', password:'admin123', role:'admin', createdAt:Date.now()});
    await saveUsers(users);
  }
  const settings = await getSettings();
  if(settings.commissionRate===undefined){ await saveSettings({commissionRate:5}); }
}

/* ============================= HELPERS ============================= */
function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type==='error' ? ' error' : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}
function navigate(hash){ location.hash = hash; }
function requireLoginRedirect(back){ toast('Silakan masuk terlebih dahulu.'); navigate('#/login?next='+encodeURIComponent(back)); }

async function cartCount(){
  const cart = await getCart();
  return cart.reduce((a,i)=>a+i.qty,0);
}

async function addToCart(productId, qty){
  const cart = await getCart();
  const row = cart.find(i=>i.productId===productId);
  if(row) row.qty += qty; else cart.push({productId, qty});
  await saveCart(cart);
  toast('Ditambahkan ke keranjang.');
  await updateHeader();
}

/* ============================= HEADER ============================= */
async function updateHeader(){
  const user = await currentUser();
  const count = await cartCount();
  const right = document.getElementById('navRight');
  const cartHtml = `<a href="#/keranjang" class="cart-btn" title="Keranjang">🛒${count>0?`<span class="cart-count">${count}</span>`:''}</a>`;
  if(!user){
    right.innerHTML = cartHtml + `<a href="#/login" class="btn btn-ghost btn-sm">Masuk</a><a href="#/login?tab=daftar-toko" class="btn btn-primary btn-sm">Daftar Toko</a>`;
  } else {
    const dashHash = user.role==='admin' ? '#/dashboard/admin' : user.role==='toko' ? '#/dashboard/toko' : '#/dashboard/pembeli';
    right.innerHTML = cartHtml + `
      <div class="user-chip" id="userChip">
        <div class="avatar">${initials(user.name)}</div>
        <span style="font-size:13.5px;font-weight:700;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(user.name)}</span>
        <div class="user-menu" id="userMenu">
          <a href="${dashHash}">Dashboard saya</a>
          <button id="logoutBtn">Keluar</button>
        </div>
      </div>`;
    document.getElementById('userChip').addEventListener('click', (e)=>{
      e.stopPropagation();
      document.getElementById('userMenu').classList.toggle('open');
    });
    document.getElementById('logoutBtn').addEventListener('click', async ()=>{
      await clearSession(); toast('Berhasil keluar.'); navigate('#/'); await updateHeader();
    });
  }
  document.querySelectorAll('#navLinks a').forEach(a=>{
    a.classList.toggle('active', location.hash==='' ? a.dataset.route==='/' : location.hash.startsWith('#'+a.dataset.route) && a.dataset.route!=='/' || (a.dataset.route==='/' && (location.hash===''||location.hash==='#/')));
  });
}
document.addEventListener('click', ()=>{ const m=document.getElementById('userMenu'); if(m) m.classList.remove('open'); });
document.getElementById('navToggle').addEventListener('click', ()=>{
  document.getElementById('navLinks').classList.toggle('open');
});

/* ============================= ROUTER ============================= */
async function render(){
  const hashRaw = location.hash.slice(1) || '/';
  const [pathPart, queryPart] = hashRaw.split('?');
  const parts = pathPart.split('/').filter(Boolean);
  const query = new URLSearchParams(queryPart||'');
  await updateHeader();
  const app = document.getElementById('app');
  app.innerHTML = '<div class="page-loading">Memuat…</div>';
  try{
    if(parts.length===0) await viewHome(app);
    else if(parts[0]==='cari') await viewSearch(app, query);
    else if(parts[0]==='kategori' && parts.length===1) await viewCategories(app);
    else if(parts[0]==='kategori') await viewCategoryProducts(app, decodeURIComponent(parts[1]));
    else if(parts[0]==='toko' && parts.length===1) await viewStoreList(app);
    else if(parts[0]==='toko') await viewStoreDetail(app, parts[1]);
    else if(parts[0]==='produk') await viewProductDetail(app, parts[1]);
    else if(parts[0]==='keranjang') await viewCart(app);
    else if(parts[0]==='checkout') await viewCheckout(app);
    else if(parts[0]==='login') await viewAuth(app, query);
    else if(parts[0]==='dashboard' && parts[1]==='pembeli') await viewDashPembeli(app, parts[2]||'pesanan');
    else if(parts[0]==='dashboard' && parts[1]==='toko') await viewDashToko(app, parts[2]||'produk');
    else if(parts[0]==='dashboard' && parts[1]==='admin') await viewDashAdmin(app, parts[2]||'statistik');
    else app.innerHTML = `<div class="wrap section-pad"><div class="empty-state"><h3>Halaman tidak ditemukan</h3><p>Coba kembali ke beranda.</p><a href="#/" class="btn btn-primary">Ke Beranda</a></div></div>`;
  }catch(e){
    console.error(e);
    app.innerHTML = `<div class="wrap section-pad"><div class="empty-state"><h3>Terjadi kesalahan</h3><p>${esc(e.message||'')}</p><button class="btn btn-ghost" onclick="location.reload()">Muat ulang</button></div></div>`;
  }
  window.scrollTo(0,0);
  document.getElementById('navLinks').classList.remove('open');
}
window.addEventListener('hashchange', render);

async function viewCart(app){
  const cart = await getCart();
  const products = await getProducts();
  const stores = await getStores();
  const rows = cart.map(item=>{
    const p = products.find(x=>x.id===item.productId);
    return p ? {...item, product:p} : null;
  }).filter(Boolean);
  const total = rows.reduce((a,r)=>a + r.product.price*r.qty, 0);
  app.innerHTML = `
  <div class="page-banner"><div class="wrap"><h1>Keranjang</h1><p>${rows.length} produk di keranjang kamu.</p></div></div>
  <div class="wrap section-pad">
    ${rows.length ? `
    <div class="split">
      <div class="panel" style="grid-column:1/-1;max-width:100%;">
        ${rows.map(r=>{
          const store = stores.find(s=>s.id===r.product.storeId);
          return `<div class="cart-row" data-id="${r.productId}">
            <div class="thumb">${esc(initials(r.product.name))}</div>
            <div style="flex:1;">
              <div style="font-weight:700;">${esc(r.product.name)}</div>
              <div class="muted" style="font-size:12.5px;">🏬 ${esc(store?store.name:'')}</div>
              <div class="card-price">${rupiah(r.product.price)}</div>
            </div>
            <div class="qty-ctrl">
              <button class="qty-dec" type="button">−</button>
              <span>${r.qty}</span>
              <button class="qty-inc" type="button">+</button>
            </div>
            <button class="btn btn-danger btn-sm remove-btn" type="button">Hapus</button>
          </div>`;
        }).join('')}
        <div style="max-width:340px;margin-left:auto;margin-top:20px;">
          <div class="summary-row total"><span>Total</span><span>${rupiah(total)}</span></div>
          <a href="#/checkout" class="btn btn-primary btn-block" style="margin-top:14px;">Checkout</a>
        </div>
      </div>
    </div>` : `<div class="empty-state"><h3>Keranjang kamu masih kosong</h3><p>Yuk cari produk dari toko sekitar.</p><a href="#/cari" class="btn btn-primary">Cari produk</a></div>`}
  </div>`;
  document.querySelectorAll('.qty-inc').forEach(btn=>btn.addEventListener('click', async (e)=>{
    const id = e.target.closest('.cart-row').dataset.id;
    const c = await getCart(); const row = c.find(i=>i.productId===id);
    const prod = products.find(p=>p.id===id);
    if(row && row.qty < prod.stock){ row.qty++; await saveCart(c); await viewCart(app); await updateHeader(); }
  }));
  document.querySelectorAll('.qty-dec').forEach(btn=>btn.addEventListener('click', async (e)=>{
    const id = e.target.closest('.cart-row').dataset.id;
    const c = await getCart(); const row = c.find(i=>i.productId===id);
    if(row){ row.qty--; const filtered = row.qty<=0 ? c.filter(i=>i.productId!==id) : c; await saveCart(filtered); await viewCart(app); await updateHeader(); }
  }));
  document.querySelectorAll('.remove-btn').forEach(btn=>btn.addEventListener('click', async (e)=>{
    const id = e.target.closest('.cart-row').dataset.id;
    const c = (await getCart()).filter(i=>i.productId!==id);
    await saveCart(c); toast('Produk dihapus dari keranjang.'); await viewCart(app); await updateHeader();
  }));
}

/* ============================= VIEW: CHECKOUT ============================= */
async function viewCheckout(app){
  const user = await currentUser();
  if(!user || user.role!=='pembeli'){
    if(!user){ requireLoginRedirect('/checkout'); return; }
    app.innerHTML = `<div class="wrap section-pad"><div class="empty-state"><h3>Hanya akun pembeli yang bisa checkout</h3><a href="#/" class="btn btn-ghost">Kembali</a></div></div>`;
    return;
  }
  const cart = await getCart();
  const products = await getProducts();
  const stores = await getStores();
  const rows = cart.map(item=>{ const p = products.find(x=>x.id===item.productId); return p ? {...item, product:p} : null; }).filter(Boolean);
  if(!rows.length){ app.innerHTML = `<div class="wrap section-pad"><div class="empty-state"><h3>Keranjang kosong</h3><a href="#/cari" class="btn btn-primary">Cari produk</a></div></div>`; return; }
  const byStore = {};
  rows.forEach(r=>{ (byStore[r.product.storeId] = byStore[r.product.storeId]||[]).push(r); });
  const total = rows.reduce((a,r)=>a+r.product.price*r.qty,0);
  app.innerHTML = `
  <div class="page-banner"><div class="wrap"><h1>Checkout</h1><p>Periksa pesananmu sebelum dikirim ke toko.</p></div></div>
  <div class="wrap section-pad">
    <div class="split">
      <div class="panel">
        <h3 style="margin-bottom:14px;">Detail pengiriman</h3>
        <form id="checkoutForm">
          <div class="field" style="margin-bottom:14px;"><label>Nama penerima</label><input name="nama" value="${esc(user.name)}" required></div>
          <div class="field" style="margin-bottom:14px;"><label>Nomor WhatsApp</label><input name="hp" value="${esc(user.contact||'')}" required></div>
          <div class="field" style="margin-bottom:14px;"><label>Alamat pengiriman</label><textarea name="alamat" required>${esc(user.area||'')}</textarea></div>
          <button class="btn btn-primary btn-block" type="submit">Buat pesanan · ${rupiah(total)}</button>
        </form>
      </div>
      <div class="panel">
        <h3 style="margin-bottom:14px;">Ringkasan pesanan</h3>
        ${Object.entries(byStore).map(([sid, items])=>{
          const store = stores.find(s=>s.id===sid);
          const sub = items.reduce((a,r)=>a+r.product.price*r.qty,0);
          return `<div style="margin-bottom:16px;">
            <div style="font-weight:700;margin-bottom:6px;">🏬 ${esc(store?store.name:'Toko')}</div>
            ${items.map(r=>`<div class="summary-row"><span>${esc(r.product.name)} × ${r.qty}</span><span>${rupiah(r.product.price*r.qty)}</span></div>`).join('')}
            <div class="summary-row" style="font-weight:700;"><span>Subtotal</span><span>${rupiah(sub)}</span></div>
          </div>`;
        }).join('')}
        <div class="summary-row total"><span>Total</span><span>${rupiah(total)}</span></div>
      </div>
    </div>
  </div>`;
  document.getElementById('checkoutForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const settings = await getSettings();
    const rate = settings.commissionRate||0;
    let allProducts = await getProducts();
    let allOrders = await getOrders();
    for(const [sid, items] of Object.entries(byStore)){
      const sub = items.reduce((a,r)=>a+r.product.price*r.qty,0);
      const order = {
        id: uid('ord'), buyerId:user.id, buyerName: fd.get('nama'), buyerPhone: fd.get('hp'), buyerAddress: fd.get('alamat'),
        storeId: sid, items: items.map(r=>({productId:r.product.id, name:r.product.name, price:r.product.price, qty:r.qty})),
        subtotal: sub, commission: Math.round(sub*rate/100), status:'baru', createdAt: Date.now()
      };
      allOrders.push(order);
      items.forEach(r=>{
        const prod = allProducts.find(p=>p.id===r.product.id);
        if(prod) prod.stock = Math.max(0, prod.stock - r.qty);
      });
    }
    await saveOrders(allOrders);
    await saveProducts(allProducts);
    await saveCart([]);
    toast('Pesanan berhasil dibuat!');
    navigate('#/dashboard/pembeli/pesanan');
  });
}

        <div class="field" style="margin-bottom:18px;"><label>Kata sandi</label><input name="password" type="password" required minlength="4"></div>

        <p class="form-note">Toko akan ditinjau admin sebelum tampil ke publik, tapi kamu sudah bisa mulai menambah produk.</p>

  function showTab(tab){
    document.querySelectorAll('#authTabs .tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
    document.querySelectorAll('[data-panel]').forEach(p=>p.style.display = p.dataset.panel===tab ? 'block':'none');
  }
  document.querySelectorAll('#authTabs .tab-btn').forEach(b=>b.addEventListener('click', ()=>showTab(b.dataset.tab)));
  showTab(['masuk','daftar-pembeli','daftar-toko'].includes(initialTab)?initialTab:'masuk');

  document.getElementById('formMasuk').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const users = await getUsers();
    const u = users.find(x=>x.contact===fd.get('contact') && x.password===fd.get('password'));
    const err = document.querySelector('[data-err="masuk"]');
    if(!u){ err.classList.add('show'); return; }
    err.classList.remove('show');
    await setSession(u.id);
    toast('Selamat datang, '+u.name+'!');
    const dashHash = u.role==='admin' ? '#/dashboard/admin' : u.role==='toko' ? '#/dashboard/toko' : (next!=='/'?'#'+next:'#/dashboard/pembeli');
    navigate(dashHash);
    await updateHeader();
  });

  document.getElementById('formDaftarPembeli').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const users = await getUsers();
    const err = document.querySelector('[data-err="daftar-pembeli"]');
    if(users.some(u=>u.contact===fd.get('contact'))){ err.textContent='Kontak ini sudah terdaftar. Silakan masuk.'; err.classList.add('show'); return; }
    err.classList.remove('show');
    const newUser = {id:uid('usr'), name:fd.get('name'), contact:fd.get('contact'), area:fd.get('area'), password:fd.get('password'), role:'pembeli', createdAt:Date.now()};
    users.push(newUser); await saveUsers(users);
    await setSession(newUser.id);
    toast('Pendaftaran berhasil! Selamat belanja.');
    navigate(next!=='/'?'#'+next:'#/dashboard/pembeli');
    await updateHeader();
  });

  document.getElementById('formDaftarToko').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const users = await getUsers();
    const err = document.querySelector('[data-err="daftar-toko"]');
    if(users.some(u=>u.contact===fd.get('contact'))){ err.textContent='Kontak ini sudah terdaftar. Silakan masuk.'; err.classList.add('show'); return; }
    err.classList.remove('show');
    const newUser = {id:uid('usr'), name:fd.get('ownerName'), contact:fd.get('contact'), password:fd.get('password'), role:'toko', createdAt:Date.now()};
    users.push(newUser); await saveUsers(users);
    const stores = await getStores();
    const store = {id:uid('str'), ownerId:newUser.id, name:fd.get('storeName'), category:fd.get('category'), address:fd.get('address'), contact:fd.get('contact'), description:'', status:'pending', createdAt:Date.now()};
    stores.push(store); await saveStores(stores);
    await setSession(newUser.id);
    toast('Toko berhasil didaftarkan! Menunggu persetujuan admin.');
    navigate('#/dashboard/toko/profil');
    await updateHeader();
  });
}

/* ============================= DASHBOARD SHELL ============================= */
function dashShell(role, active, title, links, bodyHtml){
  return `<div class="dash">
    <div class="dash-side">
      <h3>Dashboard ${role}</h3>
      ${links.map(l=>`<a href="${l.href}" class="${active===l.key?'active':''}">${l.label}</a>`).join('')}
    </div>
    <div class="dash-main">
      <div class="dash-head"><h2>${esc(title)}</h2></div>
      ${bodyHtml}
    </div>
  </div>`;
}

/* ============================= DASHBOARD: PEMBELI ============================= */
async function viewDashPembeli(app, tab){
  const user = await currentUser();
  if(!user || user.role!=='pembeli'){ requireLoginRedirect('/dashboard/pembeli'); return; }
  const links = [
    {key:'pesanan', href:'#/dashboard/pembeli/pesanan', label:'Pesanan Saya'},
    {key:'profil', href:'#/dashboard/pembeli/profil', label:'Profil'}
  ];
  let body = '';
  if(tab==='profil'){
    body = `<div class="panel" style="max-width:520px;">
      <div class="form-msg success" data-ok="profil">Profil berhasil disimpan.</div>
      <form id="profilForm">
        <div class="field" style="margin-bottom:14px;"><label>Nama</label><input name="name" value="${esc(user.name)}" required></div>
        <div class="field" style="margin-bottom:14px;"><label>Kontak</label><input name="contact" value="${esc(user.contact||'')}" required></div>
        <div class="field" style="margin-bottom:14px;"><label>Wilayah</label><input name="area" value="${esc(user.area||'')}"></div>
        <div class="field" style="margin-bottom:18px;"><label>Kata sandi baru (opsional)</label><input name="password" type="password" placeholder="Kosongkan jika tidak diubah"></div>
        <button class="btn btn-primary" type="submit">Simpan perubahan</button>
      </form>
    </div>`;
    app.innerHTML = dashShell('Pembeli', tab, 'Profil', links, body);
    document.getElementById('profilForm').addEventListener('submit', async (e)=>{
      e.preventDefault(); const fd = new FormData(e.target);
      const users = await getUsers(); const u = users.find(x=>x.id===user.id);
      u.name=fd.get('name'); u.contact=fd.get('contact'); u.area=fd.get('area');
      if(fd.get('password')) u.password = fd.get('password');
      await saveUsers(users);
      document.querySelector('[data-ok="profil"]').classList.add('show');
      await updateHeader();
    });
  } else {
    const orders = (await getOrders()).filter(o=>o.buyerId===user.id).sort((a,b)=>b.createdAt-a.createdAt);
    const stores = await getStores();
    body = orders.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tanggal</th><th>Toko</th><th>Item</th><th>Total</th><th>Status</th></tr></thead><tbody>
      ${orders.map(o=>{
        const store = stores.find(s=>s.id===o.storeId);
        return `<tr><td>${new Date(o.createdAt).toLocaleDateString('id-ID')}</td><td>${esc(store?store.name:'-')}</td>
        <td>${o.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</td><td>${rupiah(o.subtotal)}</td>
        <td><span class="badge ${o.status==='selesai'?'badge-active':o.status==='dibatalkan'?'badge-danger':'badge-info'}">${STATUS_LABEL[o.status]}</span></td></tr>`;
      }).join('')}
    </tbody></table></div>` : `<div class="empty-state"><h3>Belum ada pesanan</h3><a href="#/cari" class="btn btn-primary">Mulai belanja</a></div>`;
    app.innerHTML = dashShell('Pembeli', tab, 'Pesanan Saya', links, body);
  }
}

/* ============================= DASHBOARD: TOKO ============================= */
async function viewDashToko(app, tab){
  const user = await currentUser();
  if(!user || user.role!=='toko'){ requireLoginRedirect('/dashboard/toko'); return; }
  const stores = await getStores();
  const store = stores.find(s=>s.ownerId===user.id);
  const links = [
    {key:'profil', href:'#/dashboard/toko/profil', label:'Profil Toko'},
    {key:'produk', href:'#/dashboard/toko/produk', label:'Produk'},
    {key:'tambah', href:'#/dashboard/toko/tambah', label:'Tambah Produk'},
    {key:'pesanan', href:'#/dashboard/toko/pesanan', label:'Pesanan'},
    {key:'pelanggan', href:'#/dashboard/toko/pelanggan', label:'Pelanggan'},
    {key:'pengaturan', href:'#/dashboard/toko/pengaturan', label:'Pengaturan'}
  ];
  if(!store){ app.innerHTML = dashShell('Toko', tab, 'Toko tidak ditemukan', links, `<div class="empty-state"><h3>Data toko tidak ditemukan</h3></div>`); return; }
  const statusBadge = `<span class="badge ${store.status==='active'?'badge-active':store.status==='ditolak'?'badge-danger':'badge-pending'}" style="margin-left:10px;">${STORE_STATUS_LABEL[store.status]}</span>`;

  if(tab==='profil'){
    const body = `<div class="panel" style="max-width:600px;">
      ${store.status!=='active'?`<div class="form-msg show" style="background:rgba(227,167,63,.18);color:#8a6415;">Toko kamu ${store.status==='pending'?'sedang menunggu persetujuan admin':'ditolak admin'}. Kamu tetap bisa kelola produk.</div>`:''}
      <div class="form-msg success" data-ok="profil-toko">Profil toko disimpan.</div>
      <form id="profilTokoForm">
        <div class="field-row">
          <div class="field"><label>Nama toko</label><input name="name" value="${esc(store.name)}" required></div>
          <div class="field"><label>Kategori</label><select name="category">${CATEGORIES.map(c=>`<option ${c===store.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
        </div>
        <div class="field" style="margin-bottom:14px;"><label>Alamat</label><textarea name="address">${esc(store.address||'')}</textarea></div>
        <div class="field" style="margin-bottom:14px;"><label>Nomor WhatsApp</label><input name="contact" value="${esc(store.contact||'')}"></div>
        <div class="field" style="margin-bottom:18px;"><label>Deskripsi toko</label><textarea name="description">${esc(store.description||'')}</textarea></div>
        <button class="btn btn-primary" type="submit">Simpan profil</button>
      </form>
    </div>`;
    app.innerHTML = dashShell('Toko', tab, store.name+statusBadge, links, body);
    document.getElementById('profilTokoForm').addEventListener('submit', async (e)=>{
      e.preventDefault(); const fd = new FormData(e.target);
      const all = await getStores(); const s = all.find(x=>x.id===store.id);
      s.name=fd.get('name'); s.category=fd.get('category'); s.address=fd.get('address'); s.contact=fd.get('contact'); s.description=fd.get('description');
      await saveStores(all);
      document.querySelector('[data-ok="profil-toko"]').classList.add('show');
    });
  } else if(tab==='produk'){
    const products = (await getProducts()).filter(p=>p.storeId===store.id);
    const body = products.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Produk</th><th>Kategori</th><th>Harga</th><th>Stok</th><th></th></tr></thead><tbody>
      ${products.map(p=>`<tr data-id="${p.id}">
        <td>${esc(p.name)}</td><td>${esc(p.category)}</td>
        <td><input class="edit-price" type="number" value="${p.price}" style="width:90px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;"></td>
        <td><input class="edit-stock" type="number" value="${p.stock}" style="width:70px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;"></td>
        <td style="white-space:nowrap;"><button class="btn btn-ghost btn-sm save-prod-btn">Simpan</button> <button class="btn btn-danger btn-sm del-prod-btn">Hapus</button></td>
      </tr>`).join('')}
    </tbody></table></div>` : `<div class="empty-state"><h3>Belum ada produk</h3><a href="#/dashboard/toko/tambah" class="btn btn-primary">Tambah produk pertama</a></div>`;
    app.innerHTML = dashShell('Toko', tab, 'Produk', links, body);
    document.querySelectorAll('.save-prod-btn').forEach(btn=>btn.addEventListener('click', async (e)=>{
      const tr = e.target.closest('tr'); const id = tr.dataset.id;
      const price = parseInt(tr.querySelector('.edit-price').value)||0;
      const stock = parseInt(tr.querySelector('.edit-stock').value)||0;
      const all = await getProducts(); const p = all.find(x=>x.id===id);
      p.price = price; p.stock = stock; await saveProducts(all);
      toast('Produk diperbarui.');
    }));
    document.querySelectorAll('.del-prod-btn').forEach(btn=>btn.addEventListener('click', async (e)=>{
      const id = e.target.closest('tr').dataset.id;
      if(!confirm('Hapus produk ini?')) return;
      const all = (await getProducts()).filter(x=>x.id!==id);
      await saveProducts(all); toast('Produk dihapus.'); await viewDashToko(app,'produk');
    }));
  } else if(tab==='tambah'){
    const body = `<div class="panel" style="max-width:560px;">
      <form id="tambahForm">
        <div class="field" style="margin-bottom:14px;"><label>Nama produk</label><input name="name" required></div>
        <div class="field-row">
          <div class="field"><label>Harga (Rp)</label><input name="price" type="number" min="0" required></div>
          <div class="field"><label>Stok</label><input name="stock" type="number" min="0" required></div>
        </div>
        <div class="field" style="margin-bottom:14px;"><label>Kategori</label><select name="category" required><option value="">Pilih kategori</option>${CATEGORIES.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
        <div class="field" style="margin-bottom:18px;"><label>Deskripsi</label><textarea name="description"></textarea></div>
        <button class="btn btn-primary" type="submit">Tambah produk</button>
      </form>
    </div>`;
    app.innerHTML = dashShell('Toko', tab, 'Tambah Produk', links, body);
    document.getElementById('tambahForm').addEventListener('submit', async (e)=>{
      e.preventDefault(); const fd = new FormData(e.target);
      const all = await getProducts();
      all.push({id:uid('prd'), storeId:store.id, name:fd.get('name'), price:parseInt(fd.get('price'))||0, stock:parseInt(fd.get('stock'))||0, category:fd.get('category'), description:fd.get('description'), createdAt:Date.now()});
      await saveProducts(all);
      toast('Produk berhasil ditambahkan.');
      navigate('#/dashboard/toko/produk');
    });
  } else if(tab==='pesanan'){
    const orders = (await getOrders()).filter(o=>o.storeId===store.id).sort((a,b)=>b.createdAt-a.createdAt);
    const body = orders.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tanggal</th><th>Pembeli</th><th>Item</th><th>Total</th><th>Status</th></tr></thead><tbody>
      ${orders.map(o=>`<tr data-id="${o.id}">
        <td>${new Date(o.createdAt).toLocaleDateString('id-ID')}</td>
        <td>${esc(o.buyerName)}<br><span class="muted" style="font-size:12px;">${esc(o.buyerPhone||'')}</span></td>
        <td>${o.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</td>
        <td>${rupiah(o.subtotal)}</td>
        <td><select class="status-select">${ORDER_STATUSES.map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}</select></td>
      </tr>`).join('')}
    </tbody></table></div>` : `<div class="empty-state"><h3>Belum ada pesanan masuk</h3></div>`;
    app.innerHTML = dashShell('Toko', tab, 'Pesanan', links, body);
    document.querySelectorAll('.status-select').forEach(sel=>sel.addEventListener('change', async (e)=>{
      const id = e.target.closest('tr').dataset.id;
      const all = await getOrders(); const o = all.find(x=>x.id===id);
      o.status = e.target.value; await saveOrders(all); toast('Status pesanan diperbarui.');
    }));
  } else if(tab==='pelanggan'){
    const orders = (await getOrders()).filter(o=>o.storeId===store.id);
    const map = {};
    orders.forEach(o=>{ const k=o.buyerId; if(!map[k]) map[k]={name:o.buyerName, phone:o.buyerPhone, total:0, count:0}; map[k].total+=o.subtotal; map[k].count++; });
    const rows = Object.values(map).sort((a,b)=>b.total-a.total);
    const body = rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nama</th><th>Kontak</th><th>Jumlah pesanan</th><th>Total belanja</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.phone||'-')}</td><td>${r.count}</td><td>${rupiah(r.total)}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty-state"><h3>Belum ada pelanggan</h3></div>`;
    app.innerHTML = dashShell('Toko', tab, 'Pelanggan', links, body);
  } else if(tab==='pengaturan'){
    const body = `<div class="panel" style="max-width:480px;">
      <div class="form-msg success" data-ok="pass">Kata sandi berhasil diubah.</div>
      <form id="passForm">
        <div class="field" style="margin-bottom:18px;"><label>Kata sandi baru</label><input name="password" type="password" required minlength="4"></div>
        <button class="btn btn-primary" type="submit">Ubah kata sandi</button>
      </form>
    </div>`;
    app.innerHTML = dashShell('Toko', tab, 'Pengaturan', links, body);
    document.getElementById('passForm').addEventListener('submit', async (e)=>{
      e.preventDefault(); const fd = new FormData(e.target);
      const users = await getUsers(); const u = users.find(x=>x.id===user.id);
      u.password = fd.get('password'); await saveUsers(users);
      document.querySelector('[data-ok="pass"]').classList.add('show');
      e.target.reset();
    });
  }
}

    </tbody></table></div>`;

      const id = e.target.closest('tr').dataset.id;

      await saveUsers(all); toast('Pengguna dihapus.'); await viewDashAdmin(app,'pengguna');
    }));
  } else if(tab==='toko'){
    const stores = await getStores();
    const body = stores.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Toko</th><th>Kategori</th><th>Alamat</th><th>Status</th><th></th></tr></thead><tbody>
      ${stores.map(s=>`<tr data-id="${s.id}"><td>${esc(s.name)}</td><td>${esc(s.category)}</td><td>${esc(s.address||'-')}</td>
      <td><span class="badge ${s.status==='active'?'badge-active':s.status==='ditolak'?'badge-danger':'badge-pending'}">${STORE_STATUS_LABEL[s.status]}</span></td>
      <td style="white-space:nowrap;">
        ${s.status!=='active'?'<button class="btn btn-ghost btn-sm approve-btn">Setujui</button>':''}
        ${s.status!=='ditolak'?'<button class="btn btn-danger btn-sm reject-btn">Tolak</button>':''}
      </td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty-state"><h3>Belum ada toko terdaftar</h3></div>`;
    app.innerHTML = dashShell('Admin', tab, 'Toko', links, body);
    document.querySelectorAll('.approve-btn').forEach(btn=>btn.addEventListener('click', async (e)=>{
      const id = e.target.closest('tr').dataset.id;
      const all = await getStores(); all.find(s=>s.id===id).status='active'; await saveStores(all);
      toast('Toko disetujui.'); await viewDashAdmin(app,'toko');
    }));
    document.querySelectorAll('.reject-btn').forEach(btn=>btn.addEventListener('click', async (e)=>{
      const id = e.target.closest('tr').dataset.id;
      const all = await getStores(); all.find(s=>s.id===id).status='ditolak'; await saveStores(all);
      toast('Toko ditolak.'); await viewDashAdmin(app,'toko');
    }));
  } else if(tab==='produk'){
    const products = await getProducts();
    const stores = await getStores();
    const body = products.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Produk</th><th>Toko</th><th>Harga</th><th>Stok</th><th></th></tr></thead><tbody>
      ${products.map(p=>{ const st=stores.find(s=>s.id===p.storeId); return `<tr data-id="${p.id}"><td>${esc(p.name)}</td><td>${esc(st?st.name:'-')}</td><td>${rupiah(p.price)}</td><td>${p.stock}</td>
      <td><button class="btn btn-danger btn-sm del-p-btn">Hapus</button></td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="empty-state"><h3>Belum ada produk</h3></div>`;
    app.innerHTML = dashShell('Admin', tab, 'Produk', links, body);
    document.querySelectorAll('.del-p-btn').forEach(btn=>btn.addEventListener('click', async (e)=>{
      const id = e.target.closest('tr').dataset.id;
      if(!confirm('Hapus produk ini?')) return;
      const all = (await getProducts()).filter(p=>p.id!==id);
      await saveProducts(all); toast('Produk dihapus.'); await viewDashAdmin(app,'produk');
    }));
  } else if(tab==='pesanan'){
    const orders = (await getOrders()).sort((a,b)=>b.createdAt-a.createdAt);
    const stores = await getStores();
    const body = orders.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tanggal</th><th>Toko</th><th>Pembeli</th><th>Total</th><th>Komisi</th><th>Status</th></tr></thead><tbody>
      ${orders.map(o=>{ const st=stores.find(s=>s.id===o.storeId); return `<tr><td>${new Date(o.createdAt).toLocaleDateString('id-ID')}</td><td>${esc(st?st.name:'-')}</td>
      <td>${esc(o.buyerName)}</td><td>${rupiah(o.subtotal)}</td><td>${rupiah(o.commission)}</td>
      <td><span class="badge badge-info">${STATUS_LABEL[o.status]}</span></td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="empty-state"><h3>Belum ada transaksi</h3></div>`;
    app.innerHTML = dashShell('Admin', tab, 'Pesanan', links, body);
  } else if(tab==='komisi'){
    const settings = await getSettings();
    const orders = await getOrders();
    const komisi = orders.reduce((a,o)=>a+(o.commission||0),0);
    const body = `<div class="stat-grid" style="max-width:500px;">
      <div class="stat-card"><b>${settings.commissionRate}%</b><span>Rate komisi saat ini</span></div>
      <div class="stat-card"><b>${rupiah(komisi)}</b><span>Total komisi terkumpul</span></div>
    </div>
    <div class="panel" style="max-width:400px;">
      <div class="form-msg success" data-ok="komisi">Rate komisi diperbarui.</div>
      <form id="komisiForm">
        <div class="field" style="margin-bottom:18px;"><label>Rate komisi (%)</label><input name="rate" type="number" min="0" max="100" value="${settings.commissionRate}" required></div>
        <button class="btn btn-primary" type="submit">Simpan</button>
      </form>
      <p class="form-note">Berlaku untuk transaksi baru setelah disimpan.</p>
    </div>`;
    app.innerHTML = dashShell('Admin', tab, 'Komisi', links, body);
    document.getElementById('komisiForm').addEventListener('submit', async (e)=>{
      e.preventDefault(); const fd = new FormData(e.target);
      await saveSettings({commissionRate: parseFloat(fd.get('rate'))||0});
      document.querySelector('[data-ok="komisi"]').classList.add('show');
    });
  }
}

/* ============================= INIT ============================= */
(async function init(){
  await ensureSeed();
  await render();
})();
</script>
</body>
</html>
